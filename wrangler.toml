name = "flame-in-freefall"
main = "server/index.ts"
compatibility_date = "2026-11-01"

# One Worker, one URL. Static app from dist/, API paths hit the Hono app first.
[assets]
directory = "./dist"
binding = "ASSETS"
# "none": a missing file (e.g. /data/investigations.json) falls to the Worker and 404s, so the
# front-end loader uses its fixture. Hash routes never reach the server, so no SPA fallback is needed.
not_found_handling = "none"
run_worker_first = ["/ask", "/rank", "/verify", "/health"]

[vars]
SPEND_MODE = "live"

# Secrets (never in this file): wrangler secret put ANTHROPIC_API_KEY / TYPESAFE_API_KEY

[[kv_namespaces]]
binding = "LIBRARY"
id = "9980c25bca79488c8f9a5ee7753c50a7"
